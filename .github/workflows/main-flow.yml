name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - '@ide-a/**'
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ide-a'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run syncpack fix
        run: yarn run syncpack:fix

      - name: Run lint fix
        run: yarn run lint:all:fix

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No fixes needed"
          else
            git commit -m "style: auto-fix syncpack and lint issues"
            git push
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint-fix]
    if: always() && (needs.lint-fix.result == 'success' || needs.lint-fix.result == 'skipped')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ide-a'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Syncpack lint
        run: yarn run syncpack:lint

      - name: Lint
        run: yarn run lint:all

      - name: Build
        run: yarn run build:all

      - name: Test
        run: yarn run test:all

  version:
    needs: [build]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ide-a'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Version packages
        run: |
          yarn run version
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Trigger publish workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"publish-packages"}'
